<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku and Answer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      font-family: Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 30px 20px;
    }
    .sudoku-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 48px;
      flex-wrap: wrap;
    }
    .sudoku-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: #000000;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .sudoku-grid {
      border-collapse: collapse;
      border: 3px solid #000000;
      width: 324px;
      height: 324px;
      table-layout: fixed;
    }
    .sudoku-grid td {
      width: 36px;
      height: 36px;
      border: 1px solid #000000;
      text-align: center;
      vertical-align: middle;
      font-size: 21px;
      font-weight: 400;
      color: #000000;
      padding: 0;
      background-color: #ffffff;
      user-select: none;
    }
    .sudoku-grid td.highlight {
      background-color: #a3d3b7;
    }
    .sudoku-grid tr:nth-child(3) td,
    .sudoku-grid tr:nth-child(6) td {
      border-bottom: 3px solid #000000;
    }
    .sudoku-grid td:nth-child(3),
    .sudoku-grid td:nth-child(6) {
      border-right: 3px solid #000000;
    }
    @media (max-width: 720px) {
      .sudoku-container {
        gap: 36px;
      }
      .sudoku-grid {
        width: 288px;
        height: 288px;
      }
      .sudoku-grid td {
        width: 32px;
        height: 32px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="sudoku-container">
    <section class="sudoku-section">
      <h2 class="section-title">SUDOKU</h2>
      <table class="sudoku-grid">

          <tr>

            <td class="highlight">7</td>

</body>
