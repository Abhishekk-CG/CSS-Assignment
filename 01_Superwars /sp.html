<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Wars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', Georgia, serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding-top: 25px;
        }

        .arena {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 120px;
            width: 100%;
            max-width: 1100px;
        }

        .team {
            display: flex;
            gap: 16px;
        }

        .score-board {
            font-size: 46px;
            font-weight: 500;
            color: #000000;
            margin-top: 15px;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .card {
            width: 155px;
            height: 255px;
            background-color: #ffffff;
            border: 1px solid #d3d3d3;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 15px 20px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
        }

        .card-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .card-name {
            font-size: 15px;
            text-align: center;
            line-height: 1.25;
            color: #000000;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-power {
            font-size: 44px;
            color: #000000;
            line-height: 1;
            font-weight: 400;
        }

        @media (max-width: 850px) {
            .arena {
                gap: 40px;
            }
        }

        @media (max-width: 650px) {
            .arena {
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            .score-board {
                order: -1;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="arena">
        <div class="team">
            <div class="card">
                <img src="super-1.png" alt="Spiderman" class="card-img">
                <div class="card-name">Spiderman</div>
                <div class="card-power">12</div>
            </div>
            <div class="card">
                <img src="super-3.png" alt="Wonder Women" class="card-img">
                <div class="card-name">Wonder<br>Women</div>
                <div class="card-power">30</div>
            </div>
        </div>

        <div class="score-board">5 - 0</div>

        <div class="team">
            <div class="card">
                <img src="super-2.png" alt="Captain America" class="card-img">
                <div class="card-name">Captain<br>America</div>
                <div class="card-power">50</div>
            </div>
            <div class="card">
                <img src="super-4.png" alt="Gem Woman" class="card-img">
                <div class="card-name">Gem Woman</div>
                <div class="card-power">12</div>
            </div>
        </div>
    </div>
</body>
</html>
